services:
  traefik:
    image: traefik:v3.7
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    build: apps/api
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./apps/api:/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`nulengeo.localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=80

  web:
    build: apps/web
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./apps/web:/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`nulengeo.localhost`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=5173
