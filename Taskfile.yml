version: "3"

vars:
  UID:
    sh: id -u
  GID:
    sh: id -g

env:
  UID: "{{.UID}}"
  GID: "{{.GID}}"

tasks:
  build:
    desc: Build the Docker Compose stack images
    cmds:
      - docker compose build

  up:
    desc: Start the Docker Compose stack
    cmds:
      - docker compose up

  down:
    desc: Stop the Docker Compose stack
    cmds:
      - docker compose down

  migrate:
    desc: Run Doctrine Migrations inside the API container
    cmds:
      - docker compose exec api bin/console doctrine:migrations:migrate --no-interaction

  import:
    desc: Run the city dataset import command inside the API container
    cmds:
      - docker compose exec api bin/console app:city:import

  cache-clear:
    desc: Clear the Symfony cache and wipe active game sessions inside the API container
    cmds:
      - docker compose exec api bin/console cache:clear
      - docker compose exec api sh -c "rm -f /tmp/sess_*"

  test-api:
    desc: Run the API test suite (PHPUnit)
    cmds:
      - docker compose exec api bin/phpunit

  test-web:
    desc: Run the web test suite (Vitest)
    cmds:
      - docker compose exec web yarn test

  test:
    desc: Run both test suites
    cmds:
      - task: test-api
      - task: test-web

  lint-api:
    desc: Run the API lint/static-analysis chain (PHPStan + PHP-CS-Fixer)
    cmds:
      - docker compose exec api composer lint -- --memory-limit=512M
      - docker compose exec api composer format

  lint-web:
    desc: Run the web lint/format chain (ESLint + Prettier)
    cmds:
      - docker compose exec web yarn lint
      - docker compose exec web yarn format

  lint:
    desc: Run both lint/static-analysis chains
    cmds:
      - task: lint-api
      - task: lint-web
